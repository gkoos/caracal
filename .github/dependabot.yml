version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
          - 'tsup'
          - 'tsx'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'fast-check'
      linting:
        patterns:
          - '@biomejs/biome'
      release-tooling:
        patterns:
          - '@changesets/*'
          - 'rimraf'
      runtime:
        patterns:
          - 'ioredis'
          - 'pg'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
