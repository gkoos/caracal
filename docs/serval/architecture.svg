<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="900px" height="580px" viewBox="0 0 900 580" style="background: transparent; color-scheme: light dark;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666" style="fill: light-dark(rgb(102,102,102), rgb(170,170,170));"/>
    </marker>
  </defs>
  <g font-family="Helvetica" font-size="12">
    <g>
      <rect x="60" y="20" width="200" height="42" rx="9" ry="9" fill="#dae8fc" stroke="#6c8ebf" style="fill: light-dark(rgb(218,232,252), rgb(26,38,51)); stroke: light-dark(rgb(108,142,191), rgb(60,90,140));"/>
      <text x="160" y="46" text-anchor="middle" fill="#000000" style="fill: light-dark(#000000, #ffffff);">circuit breaker</text>
      <rect x="350" y="20" width="200" height="42" rx="9" ry="9" fill="#dae8fc" stroke="#6c8ebf" style="fill: light-dark(rgb(218,232,252), rgb(26,38,51)); stroke: light-dark(rgb(108,142,191), rgb(60,90,140));"/>
      <text x="450" y="46" text-anchor="middle" fill="#000000" style="fill: light-dark(#000000, #ffffff);">rate limit</text>
      <rect x="640" y="20" width="200" height="42" rx="9" ry="9" fill="#dae8fc" stroke="#6c8ebf" style="fill: light-dark(rgb(218,232,252), rgb(26,38,51)); stroke: light-dark(rgb(108,142,191), rgb(60,90,140));"/>
      <text x="740" y="46" text-anchor="middle" fill="#000000" style="fill: light-dark(#000000, #ffffff);">bulkhead</text>
      <text x="20" y="46" fill="#666666" style="fill: light-dark(rgb(102,102,102), rgb(170,170,170));">policy</text>
    </g>
    <g>
      <rect x="60" y="92" width="200" height="42" rx="9" ry="9" fill="#d5e8d4" stroke="#82b366" style="fill: light-dark(rgb(213,232,212), rgb(31,47,30)); stroke: light-dark(rgb(130,179,102), rgb(68,110,44));"/>
      <text x="160" y="118" text-anchor="middle" fill="#000000" style="fill: light-dark(#000000, #ffffff);">cached verdict</text>
      <rect x="350" y="92" width="200" height="42" rx="9" ry="9" fill="#d5e8d4" stroke="#82b366" style="fill: light-dark(rgb(213,232,212), rgb(31,47,30)); stroke: light-dark(rgb(130,179,102), rgb(68,110,44));"/>
      <text x="450" y="118" text-anchor="middle" fill="#000000" style="fill: light-dark(#000000, #ffffff);">local quota stock</text>
      <rect x="640" y="92" width="200" height="42" rx="9" ry="9" fill="#d5e8d4" stroke="#82b366" style="fill: light-dark(rgb(213,232,212), rgb(31,47,30)); stroke: light-dark(rgb(130,179,102), rgb(68,110,44));"/>
      <text x="740" y="118" text-anchor="middle" fill="#000000" style="fill: light-dark(#000000, #ffffff);">local slot pool</text>
      <text x="20" y="118" fill="#666666" style="fill: light-dark(rgb(102,102,102), rgb(170,170,170));">authority</text>
    </g>
    <g stroke="#666666" style="stroke: light-dark(rgb(102,102,102), rgb(170,170,170));" marker-end="url(#arrow)">
      <line x1="160" y1="62" x2="160" y2="88"/>
      <line x1="450" y1="62" x2="450" y2="88"/>
      <line x1="740" y1="62" x2="740" y2="88"/>
      <line x1="160" y1="134" x2="160" y2="168"/>
      <line x1="450" y1="134" x2="450" y2="168"/>
      <line x1="740" y1="134" x2="740" y2="168"/>
      <line x1="450" y1="292" x2="450" y2="326"/>
    </g>
    <g>
      <rect x="60" y="170" width="780" height="122" rx="9" ry="9" fill="#f5f5f5" stroke="#666666" style="fill: light-dark(rgb(245,245,245), rgb(40,40,40)); stroke: light-dark(rgb(102,102,102), rgb(170,170,170));"/>
      <text x="80" y="194" font-weight="bold" fill="#000000" style="fill: light-dark(#000000, #ffffff);">Serval session, one per process</text>
      <text x="80" y="216" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">replica identity and scope registry</text>
      <text x="80" y="236" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">bounded local authority state, epochs and expiry</text>
      <text x="80" y="256" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">invalidation, refresh and reconciliation</text>
      <text x="80" y="276" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">connection lifecycle, metrics and backpressure</text>
      <text x="520" y="216" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">many policy identities, one session</text>
      <text x="520" y="236" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">no policy semantics, a tagged protocol</text>
      <text x="520" y="256" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">shared by every operation in the process</text>
    </g>
    <g>
      <rect x="60" y="328" width="780" height="122" rx="9" ry="9" fill="#ffe6cc" stroke="#d79b00" style="fill: light-dark(rgb(255,230,204), rgb(66,43,16)); stroke: light-dark(rgb(215,155,0), rgb(160,110,0));"/>
      <text x="80" y="352" font-weight="bold" fill="#000000" style="fill: light-dark(#000000, #ffffff);">Redis: authoritative state and atomic scripts</text>
      <text x="80" y="374" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">breaker observations, transitions and probes</text>
      <text x="80" y="394" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">quota issuance and outstanding accounting</text>
      <text x="80" y="414" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">slot allocation and fleet accounting</text>
      <text x="520" y="374" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">issues authority, never admits work</text>
      <text x="520" y="394" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">server clock governs every deadline</text>
      <text x="520" y="414" font-size="11" fill="#000000" style="fill: light-dark(#000000, #ffffff);">idempotent, replay-safe operations</text>
    </g>
    <g>
      <rect x="60" y="486" width="780" height="52" rx="9" ry="9" fill="#fff2cc" stroke="#d6b656" stroke-dasharray="6 4" style="fill: light-dark(rgb(255,242,204), rgb(66,58,16)); stroke: light-dark(rgb(214,182,86), rgb(150,125,50));"/>
      <text x="80" y="517" fill="#000000" style="fill: light-dark(#000000, #ffffff);">notification channel: a wake-up hint that shortens convergence, never the correctness path</text>
    </g>
    <g stroke="#666666" style="stroke: light-dark(rgb(102,102,102), rgb(170,170,170));" marker-end="url(#arrow)">
      <line x1="850" y1="450" x2="850" y2="486"/>
      <line x1="850" y1="486" x2="850" y2="292" stroke-dasharray="6 4"/>
    </g>
  </g>
</svg>
